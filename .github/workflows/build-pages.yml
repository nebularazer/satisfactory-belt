name: Build Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage the prepared game assets
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/game-data
        run: |
          mkdir -p "$ASSET_DIRECTORY"
          tar -xzf .github/pages/game-data.tar.gz -C "$ASSET_DIRECTORY"
          pnpm assets:stage --input "$ASSET_DIRECTORY"
      - name: Build for the deployment path
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr/{0}/', github.event.number) || '' }}
        run: |
          pnpm --filter @satisfactory-belt/web exec tsc -b
          pnpm --filter @satisfactory-belt/web exec vite build --base "$PAGES_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
